name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Godot and Java
        shell: bash
        run: |
          echo "HOME=/root" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          EOF
          TEMPLATE_SOURCE="$(find / -type f -name android_debug.apk -print -quit 2>/dev/null)"
          if [ -z "$TEMPLATE_SOURCE" ]; then
            echo "Android export template not found"
            find / -type d -path '*export_templates*' -print 2>/dev/null | head -50
            exit 1
          fi
          TEMPLATE_DIR="$(dirname "$TEMPLATE_SOURCE")"
          TEMPLATE_DEST="/root/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DEST"
          if [ "$TEMPLATE_DIR" != "$TEMPLATE_DEST" ]; then
            cp -a "$TEMPLATE_DIR/." "$TEMPLATE_DEST/"
          fi
          test -s "$TEMPLATE_DEST/android_debug.apk"
          test -s "$TEMPLATE_DEST/android_release.apk"
          keytool -genkeypair -v -keystore /root/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Install complete Android SDK toolchain
        shell: bash
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -x /usr/lib/android-sdk/platform-tools/adb
          test -x /usr/lib/android-sdk/build-tools/34.0.0/apksigner
          test -d /usr/lib/android-sdk/ndk/23.2.8568313
          test -d /usr/lib/android-sdk/cmake/3.10.2.4988404

      - name: Import project resources
        shell: bash
        run: godot --headless --editor --path . --quit --verbose

      - name: Validate Android toolchain
        shell: bash
        run: |
          java -version
          godot --version
          ls -l /usr/lib/android-sdk/platform-tools/adb
          ls -l /usr/lib/android-sdk/build-tools/34.0.0/apksigner
          ls -ld /usr/lib/android-sdk/ndk/23.2.8568313 /usr/lib/android-sdk/cmake/3.10.2.4988404
          keytool -list -keystore /root/debug.keystore -storepass android
          test -s /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/thealem-rts.apk
          test -s build/thealem-rts.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thealem-rts-android
          path: build/thealem-rts.apk
          if-no-files-found: error
          retention-days: 14
